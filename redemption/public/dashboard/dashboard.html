<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/dashboards.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body >

        <div id="nome"></div>
        <div class="botoes">
            <!-- <button class="btnDados" onclick="obterDadosGrafico()">Atualizar dados</button> -->
            <a href="jogo.html"><button class="btnDados">Jogo</button></a>
        </div>


        

    <div class="container-dash">

        


        <div class="container">

            <div class="card">
                <p class="">Melhor disparo</p>
                <div id="dado" class="dado"></div><br>
            </div>

            <div class="card2">
                <p class="">Disparos totais</p>
                <div id="dado2" class="dado"></div><br>
            </div>

            <div class="card3">
                <p class="">Classe</p>
                <div id="dado3" class="dado">Iniciante</div><br>
            </div>

        </div><br>

        <div class="grafico">
            <canvas id="myChartCanvas"></canvas>
        </div>
    </div>

</body>
</html>

<script>

    nome.innerHTML = sessionStorage.NOME_USUARIO;
    idUsuario = sessionStorage.ID_USUARIO;
    window.onload = obterDadosGrafico()

    function obterDadosGrafico(){
       
        fetch(`/jogo/buscarJogos/${idUsuario}`, { cache: 'no-store' }).then(function (resposta) {

            if (resposta.ok) {
             console.log(resposta)

                resposta.json().then(json => {

                    console.log(json, `aqui ${idUsuario}`);
                    console.log(json.melhorDisparo);

                    melhorDisparo = json.melhorDisparo;
                    document.getElementById('dado').innerText = melhorDisparo/100

                    buscarDisparos()

                })
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    
    fetch(`/jogo/quantidadeDisparos/${idUsuario}`, { cache: 'no-store' }).then(function (resposta) {

            if (resposta.ok) {
             console.log(resposta)

                resposta.json().then(json => {

                    console.log(json);
                    console.log(json.quantDisparo);

                    quantDisparo = json.quantDisparo;
                    document.getElementById('dado2').innerText = quantDisparo

                    if (quantDisparo > 500 ) {
                        document.getElementById('dado3').innerText = `Amador` 
                    }
                    else if (quantDisparo > 1000 ) {
                        document.getElementById('dado3').innerText = `Experiente`
                    }
                    else if (quantDisparo > 2000 ) {
                        document.getElementById('dado3').innerText = `Veterano`
                    }
                    else if (quantDisparo > 5000 ) {
                        document.getElementById('dado3').innerText = `Ás`
                    }
                    else if (quantDisparo > 10000 ) {
                        document.getElementById('dado3').innerText = `Lenda`
                    }

                })
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    
}


    function buscarDisparos(){

        var listaDisparos = []
        
        fetch(`/jogo/buscarDisparos/${idUsuario}`, { cache: "no-cache" }).then(function (resposta){
            if (resposta.ok) {
             console.log(resposta)

                resposta.json().then(json => {

                    console.log(json);
                    console.log(json.quantDisparo + 'aeeee');

                   for(var i = 0; i < 10; i++){ 
                    listaDisparos.push(json[i].Disparo);
                   }

                    plotarGrafico(listaDisparos)
                    

                })
            } else {
                console.error('veio nada');
            }

            
        })
            .catch(function (error) {
                console.error(`quase: ${error.message}`);
            });

    }


function plotarGrafico(listaDisparos){
    console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: '10 últimos disparos',
                data: [],
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1,
                backgroundColor: 'rgba(255, 0, 0, 0.568)'
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log()

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < listaDisparos.length; i++) {
            // var registro = listaDisparos[i];
            labels.push(`${[i + 1]}° Disparo`);
            dados.datasets[0].data.push(listaDisparos[i]);
            //dados.datasets[1].data.push(registro.temperatura);
        }
   
        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'bar',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChartCanvas`),
            config
        );

        setTimeout(() => atualizarGrafico(dados, myChart), 2000);
}

   function atualizarGrafico(dados, myChart) {

        fetch(`/jogo/atualizarGrafico/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    // obterDadosGrafico(idUsuario);
                    // alertar(novoRegistro, idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    // let avisoCaptura = document.getElementById(`avisoCaptura${idAquario}`)
                    // avisoCaptura.innerHTML = ""


                    if (novoRegistro[0].listaDisparos == dados.labels[dados.labels.length]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        // avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará."
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].listaDisparos)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].listaDisparos); // incluir um novo momento

                        /*dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        dados.datasets[0].data.push(novoRegistro[0].umidade); // incluir uma nova medida de umidade

                        dados.datasets[1].data.shift();  // apagar o primeiro de temperatura
                        dados.datasets[1].data.push(novoRegistro[0].temperatura); // incluir uma nova medida de temperatura*/

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

</script>
