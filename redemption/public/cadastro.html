<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css" />
  
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body onload="listar()">
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">RED DEAD REDEMPTION II</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="peixes.html">onu</a>
        </li>

        <li>
          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        
          <h2>Bem-vindo à Valentine!</h2>
          <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Código da plataforma de jogo</span>
            <!-- <input id="codigo_input" type="text" placeholder="Plataforma de jogo playstation, xbox , ou pc gamer" /> -->
            <select id="codigo_input">
              <option value="1">Playstation</option>
              <option value="2">Xbox</option>
              <option value="3">Pc Gamer</option>
            </select>
            <div id="errNome" style="color: orange;">Console</div>
          </div>
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
            <div id="errNome" style="color: orange;">Nome</div>
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@gmail.com" />
            <div id="errEmail" style="color: orange;">Formato @gmail.com</div>
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
            <div id="errSenha" style="color: orange;">Acima de 5 caracteres</div>
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
            <div id="errConfirm" style="color: orange;">Confirme a senha</div>
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
        </div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4></h4>
      <span class="version"></span>
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>

   
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

 
    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value.trim();
    var confirmacaoSenhaVar = confirmacao_senha_input.value.trim();
    var codigoVar = Number(codigo_input.value.trim());
    // var idEmpresaVincular


    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      alert(`Preencha todos os campos!!`);
      finalizarAguardar();
      return false;
      cadastrar();
      
    } 
    if (nomeVar.length <= 1){
      errNome.innerHTML = `<div style='color:orange;'> Insira mais de 1 caracter </div>`
      finalizarAguardar();
      return false;
       cadastrar();
    }
    if (!emailVar.includes('@gmail.com')){
      errEmail.innerHTML = `<div style='color:orange;'> Email deve conter @gmail.com </div>`
      finalizarAguardar();
      return false;
       cadastrar();
    }
    if (senhaVar.length < 6){
      errSenha.innerHTML = `<div style="color:orange;">Pelo menos 5 caracter</div>`
      finalizarAguardar();
      return false;
       cadastrar();
    }
    if (confirmacaoSenhaVar != senhaVar){
      errConfirm.innerHTML = `<div style=":orange;">As senhas não coincidem</div>`
      finalizarAguardar();
      return false;
       cadastrar();
    }

    else {
      setInterval(sumirMensagem, 5000);
    }


    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigoPlataforma == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        codigoServer: codigoVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          //cardErro.style.display = "block";
          //mensagem_erro.innerHTML =

            alert("Cadastro realizado com sucesso! Redirecionando para tela de Login...");

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigoPlataforma)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
